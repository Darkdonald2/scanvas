# Builds an unsigned Scanvas.ipa on GitHub's Macs and publishes it on the "latest" release,
# so it can be downloaded straight to an iPhone and opened in AltStore / SideStore.
name: Build IPA
on:
  push:
    branches: [main, master]
    paths-ignore: ["studio/**", ".github/workflows/build-studio.yml"]
  # Pull requests are built to check they compile, but nothing is published.
  pull_request:
    paths-ignore: ["studio/**", ".github/workflows/build-studio.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The stitcher only needs Foundation, CoreGraphics, ImageIO and simd, so it is checked on its own first
      # against a synthetic 360 scene (see Tests/Panorama/main.swift).
      - name: Test the 360 stitcher
        run: |
          swiftc -O App/Sources/Panorama/PanoramaStitcher.swift Tests/Panorama/main.swift -o pano-test
          ./pano-test
      - name: Build
        run: bash make-ipa.command
      - name: Report compile errors
        if: failure()
        run: grep -E "error:" build/xcodebuild.log | sort -u | head -50 | sed 's/^/::error::/' || true
      - uses: actions/upload-artifact@v4
        with:
          name: Scanvas-ipa
          path: Scanvas.ipa
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Scanvas.ipa --title "Scanvas (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download Scanvas.ipa on your iPhone and open it in AltStore."

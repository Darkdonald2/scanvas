# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Scanvas
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Scanvas:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Scanvas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scanvas uses the camera and LiDAR sensor to scan rooms, spaces and objects.
        NSPhotoLibraryUsageDescription: Scanvas reads the photos you pick so it can turn them into 3D models.
        NSPhotoLibraryAddUsageDescription: Scanvas saves snapshots of your scans to your photo library.
    settings:
      base:
        # Change "yourname" to something unique to you before running on an iPhone.
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.scanvas
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Scanvas:
    build:
      targets:
        Scanvas: all
    run:
      config: Debug
